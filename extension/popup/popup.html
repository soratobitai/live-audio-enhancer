<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Live Audio Enhancer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img class="logo" src="../icons/icon-32.png" width="22" height="22" alt="">
    <h1>Live Audio Enhancer</h1>
    <!-- 設定（開いているタブのサイトの設定）と、サイト（サイトごとのオン・オフの一覧）の切り替え -->
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabSettings" aria-controls="settingsView">設定</button>
      <button type="button" role="tab" id="tabSites" aria-controls="sitesView">サイト</button>
    </div>
  </header>

  <main id="settingsView" role="tabpanel">
  <!-- 設定は、開いているタブのサイトごとに持つ。この行のスイッチは、このサイトでのオン・オフ（「サイト」の一覧と同じ値） -->
  <div class="site-bar">
    <span class="site-name" id="siteName"></span>
    <button type="button" id="copyToAll" class="text-button" title="このサイトの設定を、ほかのすべてのサイトにも使う（オン・オフは変えない）">ほかのサイトにも使う</button>
    <label class="switch" title="オフにすると、このサイトでは元の音に戻ります">
      <span>有効</span>
      <input type="checkbox" role="switch" id="enabled">
    </label>
  </div>

  <!-- 機能ごとにカードにまとめる。見出しの左のアイコンは、機能を見分けるための飾り -->
  <section class="card feature denoise">
    <div class="card-head">
      <span class="badge badge-denoise" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 11v2"/></svg>
      </span>
      <h2>ノイズキャンセル</h2>
      <div class="segmented three" role="radiogroup" aria-label="ノイズキャンセル">
        <label title="かけない"><input type="radio" name="denoiseMode" value="off"><span>オフ</span></label>
        <label title="ふだんはかけ、音楽や歌が続くときは外す"><input type="radio" name="denoiseMode" value="auto"><span>オート</span></label>
        <label title="いつもかける"><input type="radio" name="denoiseMode" value="on"><span>オン</span></label>
      </div>
    </div>
    <!-- 説明は、選んでいるモード（オフ / オート / オン）に合わせて popup.js で切り替える -->
    <p class="note denoise-explain"></p>
    <div class="choices" role="radiogroup" aria-label="ノイズキャンセルの強さ">
      <!-- 方式の名前と注意点は、画面には出さず、マウスを乗せたときに出す -->
      <label title="RNNoise。軽く、音の遅れも小さい">
        <input type="radio" name="engine" value="rnnoise">
        <span>標準</span>
      </label>
      <label title="DeepFilterNet3。雑音を強く抑えるが、負荷が高く、音が少し遅れる">
        <input type="radio" name="engine" value="deepfilternet">
        <span>強め</span>
      </label>
    </div>
    <p class="status denoise-note" hidden></p>
  </section>

  <section class="card feature leveler">
    <div class="card-head">
      <span class="badge badge-leveler" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 9h3M4 15h3M17 9h3M17 15h3M10 7v10M14 7v10"/></svg>
      </span>
      <h2>音量をそろえる</h2>
      <label class="switch">
        <input type="checkbox" role="switch" id="leveler" aria-label="音量をそろえる">
      </label>
    </div>
    <p class="note">大きい音を抑え、小さい音を持ち上げます</p>
    <div class="choices" role="radiogroup" aria-label="音量をそろえる強さ">
      <label><input type="radio" name="levelerStrength" value="standard"><span>標準</span></label>
      <label><input type="radio" name="levelerStrength" value="strong"><span>強め</span></label>
    </div>
  </section>

  <section class="card eq">
    <!-- EQ のゲインの決め方。オート（話し声が聞きやすいように、番組に合わせて自動）か、手動（プリセットとスライダー）のどちらか -->
    <div class="card-head">
      <span class="badge badge-eq" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M6 4v16M12 4v16M18 4v16"/><circle cx="6" cy="14" r="2.2"/><circle cx="12" cy="8" r="2.2"/><circle cx="18" cy="12" r="2.2"/></svg>
      </span>
      <h2>イコライザー</h2>
      <div class="segmented" role="radiogroup" aria-label="イコライザーの決め方">
        <label><input type="radio" name="eqMode" value="auto"><span>オート</span></label>
        <label><input type="radio" name="eqMode" value="manual"><span>手動</span></label>
      </div>
    </div>
    <div class="auto-panel">
      <p class="note">話し声が聞きやすいように、番組に合わせて整えます</p>
      <p class="status auto-note" hidden></p>
    </div>
    <div class="manual-panel">
      <select id="eqPreset" aria-label="プリセット"></select>
      <button type="button" id="reset" class="icon-button" title="フラットに戻す" aria-label="フラットに戻す">
        <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
      </button>
    </div>
    <div id="bands"></div>
  </section>
  </main>

  <!-- サイトごとのオン・オフ。対応サイト以外のタブで開いたときは、こちらだけ使える -->
  <main id="sitesView" role="tabpanel" hidden>
    <section class="card">
      <h2>サイトごとのオン・オフ</h2>
      <p class="note">オフにしたサイトでは、音に何もしません</p>
      <div id="siteList" class="site-list"></div>
    </section>
    <p class="note unsupported" id="unsupported" hidden>このタブは対応サイトではないので、設定は変えられません。</p>
  </main>

  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
