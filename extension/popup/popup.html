<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Audio FX</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Audio FX</h1>
    <label class="switch">
      <span>有効</span>
      <input type="checkbox" role="switch" id="enabled">
    </label>
  </header>
  <section class="feature denoise">
    <label class="switch option">
      <span>
        ノイズキャンセル
        <small>声以外の音を抑えます。音楽は音質が落ちることがあります</small>
      </span>
      <input type="checkbox" role="switch" id="denoise">
    </label>
    <div class="choices" role="radiogroup" aria-label="ノイズキャンセルの強さ">
      <label>
        <input type="radio" name="engine" value="rnnoise">
        <span>標準<small>RNNoise</small></span>
      </label>
      <label>
        <input type="radio" name="engine" value="deepfilternet">
        <span>強め<small>DeepFilterNet3</small></span>
      </label>
    </div>
  </section>
  <section class="feature leveler">
    <label class="switch option">
      <span>
        音量をそろえる
        <small>大きい音を抑え、小さい音を持ち上げます</small>
      </span>
      <input type="checkbox" role="switch" id="leveler">
    </label>
    <div class="choices" role="radiogroup" aria-label="音量をそろえる強さ">
      <label><input type="radio" name="levelerStrength" value="standard"><span>標準</span></label>
      <label><input type="radio" name="levelerStrength" value="strong"><span>強め</span></label>
    </div>
  </section>
  <section class="eq">
    <!-- EQ のゲインの決め方。オート（番組に合わせて自動）か、手動（プリセットとスライダー）のどちらか -->
    <div class="eq-head">
      <span>イコライザー</span>
      <div class="segmented" role="radiogroup" aria-label="イコライザーの決め方">
        <label><input type="radio" name="eqMode" value="auto"><span>オート</span></label>
        <label><input type="radio" name="eqMode" value="manual"><span>手動</span></label>
      </div>
    </div>
    <div class="auto-panel">
      <small class="auto-note"></small>
    </div>
    <label class="manual-panel">
      <span>プリセット</span>
      <select id="eqPreset"></select>
    </label>
    <div id="bands"></div>
  </section>
  <footer>
    <span class="hint">つまみをダブルクリックで 0 dB</span>
    <button type="button" id="reset">フラットに戻す</button>
  </footer>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
