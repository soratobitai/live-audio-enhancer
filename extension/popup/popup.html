<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Audio FX</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Audio FX</h1>
    <label class="switch">
      <span>有効</span>
      <input type="checkbox" role="switch" id="enabled">
    </label>
  </header>
  <section id="bands" aria-label="イコライザー"></section>
  <footer>
    <span class="hint">つまみをダブルクリックで 0 dB</span>
    <button type="button" id="reset">フラットに戻す</button>
  </footer>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
