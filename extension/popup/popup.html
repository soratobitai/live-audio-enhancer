<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>Audio FX</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Audio FX</h1>
    <label class="switch">
      <span>有効</span>
      <input type="checkbox" role="switch" id="enabled">
    </label>
  </header>
  <section class="denoise">
    <label class="switch option">
      <span>
        ノイズキャンセル
        <small>声以外の音を抑えます。音楽は音質が落ちることがあります</small>
      </span>
      <input type="checkbox" role="switch" id="denoise">
    </label>
    <div class="choices engines" role="radiogroup" aria-label="ノイズキャンセルの方式">
      <label>
        <input type="radio" name="engine" value="rnnoise">
        <span>RNNoise<small>軽い・遅延 約13ms</small></span>
      </label>
      <label>
        <input type="radio" name="engine" value="deepfilternet">
        <span>DeepFilterNet3<small>強力・遅延 約71ms</small></span>
      </label>
    </div>
  </section>
  <section class="leveler">
    <div class="title">
      音量をそろえる
      <small>大きい音を抑え、小さい音を持ち上げます</small>
    </div>
    <div class="choices levels" role="radiogroup" aria-label="音量をそろえる強さ">
      <label><input type="radio" name="leveler" value="off"><span>オフ</span></label>
      <label><input type="radio" name="leveler" value="light"><span>弱</span></label>
      <label><input type="radio" name="leveler" value="medium"><span>中</span></label>
      <label><input type="radio" name="leveler" value="strong"><span>強</span></label>
    </div>
  </section>
  <section class="eq">
    <div class="eq-head">
      <span>イコライザー</span>
      <select id="eqPreset" aria-label="イコライザーのプリセット"></select>
    </div>
    <div class="auto-options" hidden>
      <div class="choices strengths" role="radiogroup" aria-label="オートEQの強さ">
        <label><input type="radio" name="autoStrength" value="gentle"><span>控えめ</span></label>
        <label><input type="radio" name="autoStrength" value="standard"><span>標準</span></label>
        <label><input type="radio" name="autoStrength" value="strong"><span>強め</span></label>
      </div>
      <div class="auto-note"></div>
    </div>
    <div id="bands"></div>
  </section>
  <footer>
    <span class="hint">つまみをダブルクリックで 0 dB</span>
    <button type="button" id="reset">フラットに戻す</button>
  </footer>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
