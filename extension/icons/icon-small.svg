<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Audio FX のアイコン（16px 用）。小さいとつまみが潰れるので、高さの違う3本の棒にする -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#7b3fe4"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="16" height="16" rx="3.5" fill="url(#bg)"/>
  <g fill="#ffffff">
    <rect x="3" y="7" width="2" height="6" rx="1"/>
    <rect x="7" y="3" width="2" height="10" rx="1"/>
    <rect x="11" y="5" width="2" height="8" rx="1"/>
  </g>
</svg>
