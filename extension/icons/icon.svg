<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Audio FX のアイコン（32px 以上用）。イコライザーのつまみ3本を、青から紫のグラデーションの角丸の四角に置く -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f80ed"/>
      <stop offset="1" stop-color="#7b3fe4"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.45">
    <line x1="38" y1="30" x2="38" y2="98"/>
    <line x1="64" y1="30" x2="64" y2="98"/>
    <line x1="90" y1="30" x2="90" y2="98"/>
  </g>
  <g fill="#ffffff">
    <circle cx="38" cy="76" r="13"/>
    <circle cx="64" cy="44" r="13"/>
    <circle cx="90" cy="62" r="13"/>
  </g>
</svg>
